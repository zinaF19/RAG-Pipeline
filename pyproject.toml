[project]
name = "ds-rag-pipeline"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "pydantic>=2.13.4",
    "langchain>=1.4.7",
    "langchain-mistralai>=1.1.6",
    "langchain-openrouter>=0.2.9",
    "langchain-google-genai>=4.4.2",
    "langchain-qdrant>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-core>=1.4.8",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langchainhub>=0.1.21",
    "langsmith>=0.9.3",
    "markitdown[pdf]>=0.1.6",
    "numpy>=2.5.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
